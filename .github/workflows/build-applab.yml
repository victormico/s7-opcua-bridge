name: Build App Lab zip

# Validation build: make sure the App Lab zip still builds on every PR. The
# artifact is uploaded for convenience; the released asset is published by
# release-please.yml when a release PR is merged.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build App Lab zip
        run: python scripts/build_applab_zip.py

      - uses: actions/upload-artifact@v4
        with:
          name: s7-opcua-gateway-applab
          path: dist/s7-opcua-gateway-applab.zip
